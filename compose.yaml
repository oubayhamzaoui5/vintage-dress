services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup first}
      MYSQL_DATABASE: vintage_dress
      MYSQL_USER: vintage
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - vintage_mysql:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u vintage vintage_dress -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
volumes:
  vintage_mysql:
